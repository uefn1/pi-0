name: pi-compute

on:
  workflow_dispatch:
    inputs:
      max_digits:
        description: '最大何桁まで'
        default: '10000000'
        type: string

permissions:
  contents: write
  actions: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Update progress to RUNNING
        run: |
          python -c "
          import json, datetime
          from pathlib import Path
          p = Path('pi_data/progress.json')
          data = json.loads(p.read_text()) if p.exists() else {}
          data.update({
            'status': 'running',
            'last_updated': datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'runner': '${{ github.run_id }}'
          })
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          "
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"
          git add pi_data/progress.json
          git commit -m "progress: running" || true
          git push || true

      - name: Compute next 100k
        run: python compute_pi.py --max-digits ${{ inputs.max_digits }}

      - name: Commit results and update progress to COMMITTED
        run: |
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"
          git pull --rebase origin main || true
          git add pi_data/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "pi: $(cat pi_data/index.json) $(cat pi_data/progress.json | jq -c .)"
          git push

      - name: Trigger next workflow BEFORE exit
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAX: ${{ inputs.max_digits }}
        run: |
          TOTAL=$(jq -r .total_digits pi_data/index.json)
          MAX_INT=$(echo $MAX | tr -d '"')

          # progress.jsonを最終更新: 次を起動する直前
          python -c "
          import json, datetime
          from pathlib import Path
          p = Path('pi_data/progress.json')
          data = json.loads(p.read_text())
          data['status'] = 'completed' if $TOTAL >= $MAX_INT else 'waiting_next'
          data['last_updated'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          "
          git add pi_data/progress.json
          git commit -m "progress: waiting_next $TOTAL" || true
          git push || true

          if [ "$TOTAL" -ge "$MAX_INT" ]; then
            echo "All done. Not triggering next."
            exit 0
          fi

          echo "Triggering next run..."
          gh workflow run pi-compute.yml -f max_digits=$MAX
          echo "Next triggered. Current process will now exit."
