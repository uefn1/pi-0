name: pi-compute-infinite

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - run: pip install -r requirements.txt

      - name: Mark as running
        run: |
          python -c "
          import json, datetime
          from pathlib import Path
          p=Path('pi_data/progress.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({'status':'running','last_updated':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':'${{ github.run_id }}'})
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False))
          "
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"
          git add pi_data/progress.json
          git commit -m "progress: running" || true
          git push || true

      - name: Compute next 100k
        run: python compute_pi.py

      - name: Commit results
        run: |
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"
          git pull --rebase origin main
          git add pi_data/
          git commit -m "pi: $(cat pi_data/index.json | jq -c .) $(cat pi_data/progress.json | jq -c .status)" || exit 0
          git push

      - name: Update progress to waiting_next BEFORE exit
        if: always()
        run: |
          python -c "
          import json, datetime
          from pathlib import Path
          p=Path('pi_data/progress.json')
          d=json.loads(p.read_text())
          d['status']='waiting_next'
          d['last_updated']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False))
          "
          git add pi_data/progress.json
          git commit -m "progress: waiting_next" || true
          git push || true

      - name: Trigger next run and terminate current
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next infinite run..."
          gh workflow run pi-compute.yml
          echo "Triggered. This run will now exit."
