name: pi-compute-infinite

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  compute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix git rebase error
        run: |
          git config --global pull.rebase true
          git config --global rebase.autoStash true
          git config user.name "pi-bot"
          git config user.email "pi-bot@github.actions"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Show current progress CLI
        run: |
          echo "=== CURRENT PROGRESS ==="
          cat pi_data/progress.json | jq . || echo "No progress yet"
          cat pi_data/index.json | jq . || echo "No index yet"
          echo "========================="

      - name: Mark as running
        run: |
          python -c "
          import json, datetime
          from pathlib import Path
          p=Path('pi_data/progress.json')
          d=json.loads(p.read_text()) if p.exists() else {}
          d.update({
            'status':'running',
            'last_updated':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'run_id':'${{ github.run_id }}',
            'run_number':'${{ github.run_number }}'
          })
          p.parent.mkdir(exist_ok=True)
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False))
          print(f'[CLI] Status -> running (run ${{ github.run_number }})')
          "
          git add pi_data/progress.json
          git commit -m "progress: running #${{ github.run_number }}" || true
          git push || true

      - name: Compute next 100k with CLI progress
        run: python compute_pi.py

      - name: Show after compute
        run: |
          echo "=== AFTER COMPUTE ==="
          cat pi_data/progress.json | jq .
          ls -lh pi_data/ | tail -n 10
          echo "====================="

      - name: Commit results
        run: |
          git add pi_data/
          git pull --rebase --autostash origin main || true
          git commit -m "pi: $(jq -c . pi_data/index.json) - $(jq -c .status pi_data/progress.json) #${{ github.run_number }}" || echo "No changes"
          git push || true

      - name: Update progress to waiting_next BEFORE exit
        if: always()
        run: |
          python -c "
          import json, datetime
          from pathlib import Path
          p=Path('pi_data/progress.json')
          d=json.loads(p.read_text())
          d['status']='waiting_next'
          d['last_updated']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          p.write_text(json.dumps(d, indent=2, ensure_ascii=False))
          print(f'[CLI] Status -> waiting_next, total={d.get(\"total_digits\")} digits')
          "
          git add pi_data/progress.json
          git pull --rebase --autostash origin main || true
          git commit -m "progress: waiting_next" || true
          git push || true

      - name: Trigger next run and terminate current
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "[CLI] Triggering next infinite run..."
          gh workflow run pi-compute.yml
          echo "[CLI] Triggered. Current process will now exit."
